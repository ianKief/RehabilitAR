<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <h1>Registrar manualmente a un paciente:</h1>

        {% if error %}
            <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        <form method="post" action="{{ url_for('presente_manual.registrar_asistencia_manual') }}">
            <input required type="text" name="dni" id="dni" maxlength="8" placeholder="Ingrese el DNI sin puntos">
            <button type="submit" value="Enviar">Enviar</button>
        </form>
    </body>
</html>
