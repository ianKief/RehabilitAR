{% extends "layout.html" %}

{% block title %}Crear Usuario | RehabilitAR{% endblock %}

{% block content %}
<div class="columns is-centered">
    <div class="column">
        <div class="box">
            <div class="has-text-centered-mobile mb-5">
                <h1 class="title is-3 is-4-mobile">
                    <span class="icon-text">
                        <span class="icon has-text-primary"><i class="fas fa-user-plus"></i></span>
                        <span>Crear Usuario</span>
                    </span>
                </h1>
                <p class="subtitle is-6 has-text-grey-dark">Completa los datos para registrar un nuevo usuario en el sistema.</p>
            </div>

            <hr>

            {% if error %}
            <div class="notification is-danger is-light mb-4">
                <button class="delete" onclick="this.parentElement.style.display='none'"></button>
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('usuarios.crear_usuario') }}" method="POST">
                <div class="columns is-multiline">
                    
                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">Nombre</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" name="nombre" placeholder="Ej: Juan" required>
                                <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">Apellido</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" name="apellido" placeholder="Ej: Pérez" required>
                                <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">DNI</label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" name="dni" placeholder="Sin puntos ni espacios" required>
                                <span class="icon is-small is-left"><i class="fas fa-id-card"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">Correo Electrónico</label>
                            <div class="control has-icons-left">
                                <input class="input" type="email" name="email" placeholder="Ej: juan@email.com" required>
                                <span class="icon is-small is-left"><i class="fas fa-envelope"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">Contraseña provisional</label>
                            <div class="control has-icons-left">
                                <input class="input" type="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
                                <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="column is-half">
                        <div class="field">
                            <label class="label has-text-grey">Rol del Usuario</label>
                            <div class="control has-icons-left">
                                <div class="select is-fullwidth">
                                    <select name="rol" required>
                                        <option value="" disabled selected>Seleccione un rol...</option>
                                        <option value="cliente">Cliente</option>
                                        <option value="recepcionista">Recepcionista</option>
                                        <option value="profesor">Profesor</option>
                                        <option value="administrador">Administrador</option>
                                    </select>
                                </div>
                                <span class="icon is-small is-left"><i class="fas fa-id-badge"></i></span>
                            </div>
                        </div>
                    </div>

                </div>

                <hr>

                <div class="field is-grouped is-grouped-right mt-5">
                    <p class="control">
                        <a href="{{ url_for('usuarios.listar_usuarios') }}" class="button is-light is-fullwidth-mobile">Cancelar</a>
                    </p>
                    <p class="control">
                        <button type="submit" class="button is-primary is-fullwidth-mobile">
                            <span class="icon"><i class="fas fa-save"></i></span>
                            <span>Registrar Usuario</span>
                        </button>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
