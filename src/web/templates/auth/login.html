{% extends "layout.html" %}

{% block title %}Iniciar Sesión | RehabilitAR{% endblock %}

{% block content %}
<div class="columns is-centered mt-6">
    <div class="column is-4">
        <div class="box p-5" style="border-top: 5px solid #3273dc;">
            
            <div class="has-text-centered mb-5">
                <span class="icon is-large has-text-link mb-2">
                    <i class="fas fa-user-circle fa-3x"></i>
                </span>
                <h1 class="title is-4">Iniciar Sesión</h1>
                <p class="subtitle is-6 has-text-grey">Ingresá tus credenciales para continuar</p>
            </div>

            {% if error %}
            <div class="notification is-danger is-light py-3 is-size-7">
                <span class="icon"><i class="fas fa-exclamation-triangle"></i></span>
                <strong>{{ error }}</strong>
            </div>
            {% endif %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                
                <div class="field">
                    <label class="label">Correo Electrónico</label>
                    <div class="control has-icons-left">
                        <input class="input" type="email" name="email" placeholder="ejemplo@gmail.com" required>
                        <span class="icon is-small is-left">
                            <i class="fas fa-envelope"></i>
                        </span>
                    </div>
                </div>

                <div class="field mt-4">
                    <label class="label">Contraseña</label>
                    <div class="control has-icons-left">
                        <input class="input" type="password" name="password" placeholder="********" required>
                        <span class="icon is-small is-left">
                            <i class="fas fa-lock"></i>
                        </span>
                    </div>
                </div>

                <div class="field mt-5">
                    <div class="control">
                        <button type="submit" class="button is-link is-fullwidth has-text-weight-bold">
                            Iniciar Sesión
                        </button>
                    </div>
                </div>

            </form>
            
            <hr>
            
            <div class="has-text-centered is-size-7">
                <p>¿No tenés una cuenta? <a href="{{ url_for('auth.registrar_cliente') }}">Registrate acá</a></p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
