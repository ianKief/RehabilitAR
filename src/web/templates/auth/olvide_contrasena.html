{% extends "layout.html" %}
{% block title %}Olvidé mi contraseña | RehabilitAR{% endblock %}

{% block content %}
<div class="container is-max-desktop mt-6">
    <div class="box mx-auto p-6" style="max-width: 500px; border-radius: 1rem;">
        <div class="has-text-centered mb-5">
            <span class="icon is-large has-text-info mb-3"><i class="fas fa-envelope-open-text fa-3x"></i></span>
            <h1 class="title is-4">Recuperar Contraseña</h1>
            <p class="has-text-grey">Ingresá tu email y te enviaremos un enlace para restablecerla.</p>
        </div>

        <form action="{{ url_for('auth.olvide_contrasena') }}" method="POST">
            <div class="field mb-5">
                <label class="label has-text-grey">Correo Electrónico</label>
                <div class="control has-icons-left">
                    <input class="input" type="email" name="email" required placeholder="ejemplo@correo.com">
                    <span class="icon is-small is-left"><i class="fas fa-envelope"></i></span>
                </div>
            </div>
            <button type="submit" class="button is-info is-fullwidth has-text-weight-bold">Enviar link de recuperación</button>
        </form>
        
        <div class="has-text-centered mt-4">
            <a href="{{ url_for('auth.login') }}" class="is-size-7">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
