{% extends "layout.html" %}
{% block title %}Restablecer Contraseña | RehabilitAR{% endblock %}

{% block content %}
<div class="container is-max-desktop mt-6">
    <div class="box mx-auto p-6" style="max-width: 500px; border-radius: 1rem;">
        <div class="has-text-centered mb-5">
            <span class="icon is-large has-text-success mb-3"><i class="fas fa-key fa-3x"></i></span>
            <h1 class="title is-4">Crear nueva contraseña</h1>
            <p class="has-text-grey">Ingresá tu nueva clave (Mínimo 6 caracteres).</p>
        </div>

        <form action="{{ url_for('auth.restablecer_contrasena', token=token) }}" method="POST">
            <div class="field mb-4">
                <label class="label has-text-grey">Nueva Contraseña</label>
                <div class="control has-icons-left">
                    <input class="input" type="password" name="password" required placeholder="******">
                    <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                </div>
            </div>
            
            <div class="field mb-5">
                <label class="label has-text-grey">Confirmar Contraseña</label>
                <div class="control has-icons-left">
                    <input class="input" type="password" name="confirmacion" required placeholder="******">
                    <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
                </div>
            </div>

            <button type="submit" class="button is-success is-fullwidth has-text-weight-bold">Restablecer contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
