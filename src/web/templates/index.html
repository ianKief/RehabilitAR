<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de prueba</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f5f5;
        color: #333;
      }
      header {
        background: #007acc;
        color: white;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1.5rem;
      }
      section {
        background: white;
        padding: 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      button {
        background: #007acc;
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button:hover {
        background: #005fa3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RehabilitAR - Página de prueba</h1>
      <p>Ejemplo simple de plantilla HTML para verificar el renderizado.</p>
    </header>
    <section>
      <h2>Bienvenido</h2>
      <p>Esta es una página de prueba con contenido básico y un botón interactivo.</p>
      <button type="button" onclick="alert('Prueba exitosa')">Probar alerta</button>
    </section>
    {% if error %}
      <p>{{error}}</p>
    {% endif %}
  </body>
</html>
